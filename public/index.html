<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Session Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1><img src="/logo.svg" alt="" class="brand-mark"><span class="brand-name"><span class="brand-agent">Agent</span><span class="brand-session">Session</span><span class="brand-badge">Hub</span></span></h1>
      <nav id="agent-chips" class="chips" aria-label="Filter by agent"></nav>
      <label class="search-field">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5"></circle>
          <path d="M12.6 12.6 17 17"></path>
        </svg>
        <input id="search" type="search" placeholder="Search session content" autocomplete="off" aria-label="Search session content">
      </label>
      <div id="filters" class="filters"></div>
      <span id="status" class="status">Loading…</span>
    </header>
    <main class="layout">
      <section class="list-pane">
        <div class="sidebar-scroll">
          <ul id="session-list" class="session-list"></ul>
          <p id="list-empty" class="empty" hidden>No matching sessions</p>
          <p id="list-error" class="error" hidden></p>
        </div>
        <div class="sidebar-footer">
          <button id="settings-button" class="settings-button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"></path>
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
            </svg>
            <span>Settings</span>
          </button>
        </div>
      </section>
      <section id="session-detail" class="detail-pane">
        <p class="empty">Select a session from the left</p>
      </section>
      <div id="detail-jump" class="detail-jump" hidden>
        <button id="jump-top" class="jump-btn" type="button" data-tooltip="Jump to top" aria-label="Jump to top">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12l5-5 5 5"></path>
          </svg>
        </button>
        <button id="jump-bottom" class="jump-btn" type="button" data-tooltip="Jump to bottom" aria-label="Jump to bottom">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 8l5 5 5-5"></path>
          </svg>
        </button>
      </div>
      <section id="settings-view" class="detail-pane settings-pane" hidden></section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
